name: Security and reproducible build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run security:supply-chain
      - run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run security:secrets
      - run: npm run test:auth
      - run: npm run test:uploads
      - run: npm run test:public
      - run: npm run test:content
      - run: npm run test:monitoring
      - run: npm run test:backup
      - run: npm run verify:reproducible
        env:
          BUILD_COMMIT: ${{ github.sha }}
      - run: npm run verify:build
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
